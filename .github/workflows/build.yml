                      if (favorites.isEmpty()) Box(modifier = Modifier.fillMaxSize().haze(state = hazeState), contentAlignment = Alignment.Center) { Text("No favorites yet", color = Color.White.copy(alpha = 0.5f)) }
                      else LazyVerticalGrid(columns = GridCells.Fixed(4), modifier = Modifier.fillMaxSize().haze(state = hazeState), contentPadding = PaddingValues(top = 110.dp, bottom = 130.dp + navBarPad)) {
                          itemsIndexed(favorites) { index, media ->
                              Box(modifier = Modifier.aspectRatio(1f).padding(1.dp).clickable { onMediaClick(mediaList.indexOf(media)) }, contentAlignment = Alignment.Center) {
