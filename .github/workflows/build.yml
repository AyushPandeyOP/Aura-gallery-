                  ViewMode.ALBUMS -> {
                      LazyVerticalGrid(columns = GridCells.Fixed(2), modifier = Modifier.fillMaxSize().haze(state = hazeState), contentPadding = PaddingValues(top = 110.dp, bottom = 130.dp + navBarPad, start = 8.dp, end = 8.dp)) {
                          items(albums.size) { index -> AlbumCard(albums[index]) }
                      }
                  }
                  ViewMode.FAVORITES -> {
