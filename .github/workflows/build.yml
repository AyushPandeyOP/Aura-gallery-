                          Spacer(Modifier.height(12.dp))
                          Row(modifier = Modifier.fillMaxWidth().padding(8.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) { Text("Dark Mode", color = Color.White); Icon(Icons.Default.Check, null, tint = Color(0xFFFFD700)) }
                          Row(modifier = Modifier.fillMaxWidth().padding(8.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) { Text("HD Thumbnails", color = Color.White); Icon(Icons.Default.Check, null, tint = Color(0xFFFFD700)) }
