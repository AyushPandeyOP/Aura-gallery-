          @Composable
          fun GalleryGrid(mediaList: List<Media>, hasPerm: Boolean, hazeState: HazeState, gridState: LazyGridState, viewMode: ViewMode, albums: List<Album>, onMediaClick: (Int) -> Unit) {
              val navBarPad = WindowInsets.navigationBars.asPaddingValues().calculateBottomPadding()
              when (viewMode) {
                  ViewMode.ALL_MEDIA -> {
                      if (mediaList.isEmpty() && hasPerm) CircularProgressIndicator(modifier = Modifier.fillMaxSize().wrapContentSize(Alignment.Center), color = Color.White)
                      else LazyVerticalGrid(state = gridState, columns = GridCells.Fixed(4), modifier = Modifier.fillMaxSize().haze(state = hazeState), contentPadding = PaddingValues(top = 110.dp, bottom = 130.dp + navBarPad)) {
                          itemsIndexed(mediaList) { index, media ->
                              Box(modifier = Modifier.aspectRatio(1f).padding(1.dp).clickable { onMediaClick(index) }, contentAlignment = Alignment.Center) {
                                  AsyncImage(model = ImageRequest.Builder(LocalContext.current).data(media.uri).crossfade(true).build(), contentDescription = null, contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize())
                                  if (media.isVideo) Icon(Icons.Default.PlayArrow, null, tint = Color.White, modifier = Modifier.size(26.dp).shadow(4.dp))
                              }
                          }
                      }
