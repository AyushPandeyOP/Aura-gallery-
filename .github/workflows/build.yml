name: Aura Gallery (V34 - The Master Engine Fix) 💀🔥

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android Project from Multi-Files 🪄
        run: |
          mkdir -p app/src/main/java/com/aura/gallery
          mkdir -p app/src/main/res/values

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Aura Gallery"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.3.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.23" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android { namespace = "com.aura.gallery"; compileSdk = 34; defaultConfig { applicationId = "com.aura.gallery"; minSdk = 31; targetSdk = 34; versionCode = 1; versionName = "3.4" }; buildFeatures { compose = true }; composeOptions { kotlinCompilerExtensionVersion = "1.5.11" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }
          dependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.activity:activity-compose:1.8.2"); implementation(platform("androidx.compose:compose-bom:2024.02.00")); implementation("androidx.compose.ui:ui"); implementation("androidx.compose.material3:material3"); implementation("androidx.compose.foundation:foundation"); implementation("dev.chrisbanes.haze:haze:0.6.0"); implementation("io.coil-kt:coil-compose:2.6.0"); implementation("androidx.media3:media3-exoplayer:1.2.1"); implementation("androidx.media3:media3-ui:1.2.1") }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <application android:allowBackup="true" android:label="Aura Gallery" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">Aura Gallery</string></resources>
          EOF

          # 🔥 CLAUDE KA MEDIAMODEL.KT 🔥
          cat << 'EOF' > app/src/main/java/com/aura/gallery/MediaModel.kt
          package com.aura.gallery

          data class Media(
              val uri: String,
              val isVideo: Boolean,
              val bucketName: String = "Camera",
              val bucketId: Long = 0L,
              val isFavorite: Boolean = false,
              val timestamp: Long = 0L,
              val displayName: String = ""
          )

          data class Album(
              val bucketId: Long,
              val bucketName: String,
              val thumbnailUri: String,
              val count: Int,
              val lastModified: Long
          )

          enum class ViewMode { ALL_MEDIA, ALBUMS, FAVORITES }
          EOF

          # 🔥 CLAUDE KA COMPONENTS.KT (LIQUID BLUR + SLIDE + SPRING) 🔥
          cat << 'EOF' > app/src/main/java/com/aura/gallery/Components.kt
          @file:OptIn(androidx.compose.foundation.ExperimentalFoundationApi::class)
          package com.aura.gallery

          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.*
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.hapticfeedback.HapticFeedbackType
          import androidx.compose.ui.platform.*
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.*
          import coil.compose.AsyncImage
          import coil.request.ImageRequest
          import androidx.compose.ui.layout.ContentScale
          import dev.chrisbanes.haze.*

          @Composable
          fun PandeyJiGlow() {
              val anim = rememberInfiniteTransition(label = "glow")
              val alpha by anim.animateFloat(0.2f, 1f, infiniteRepeatable(tween(1500), RepeatMode.Reverse), label = "alpha")
              Text("Developed By Pandey Ji 👑", color = Color(0xFFFFD700).copy(alpha = alpha), style = TextStyle(shadow = Shadow(Color(0xFFFFD700), blurRadius = 30f * alpha)), fontSize = 18.sp, fontWeight = FontWeight.ExtraBold)
          }

          @Composable
          fun TopBar(screen: String, hazeState: HazeState, blurVal: Float, isScrolling: Boolean, modifier: Modifier, onProfileClick: () -> Unit) {
              val haptic = LocalHapticFeedback.current
              val offsetY by animateDpAsState(targetValue = if (isScrolling) (-100).dp else 0.dp, animationSpec = tween(300), label = "topBarSlide")
              Box(modifier = modifier.offset(y = offsetY).padding(top = 40.dp, start = 24.dp, end = 24.dp).fillMaxWidth().height(55.dp).shadow(10.dp, RoundedCornerShape(25.dp)).hazeChild(hazeState, RoundedCornerShape(25.dp), HazeStyle(tint = Color.White.copy(alpha = 0.1f), blurRadius = blurVal.dp, noiseFactor = 0.05f))) {
                  Row(modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Icon(Icons.Default.Search, null, tint = Color.Gray)
                      Text("Smart Search...", color = Color.Gray, fontSize = 16.sp, modifier = Modifier.weight(1f).padding(start = 12.dp))
                      IconButton(onClick = { haptic.performHapticFeedback(HapticFeedbackType.LongPress); onProfileClick() }) {
                          Icon(Icons.Default.Person, null, tint = if (screen == "SETTINGS") Color(0xFFFFD700) else Color.White.copy(alpha = 0.8f))
                      }
                  }
              }
          }

          @Composable
          fun BottomDock(screen: String, hazeState: HazeState, blurVal: Float, isScrolling: Boolean, modifier: Modifier, onTabSelected: (String) -> Unit) {
              val haptic = LocalHapticFeedback.current
              val navBarPad = WindowInsets.navigationBars.asPaddingValues().calculateBottomPadding()
              val offsetY by animateDpAsState(targetValue = if (isScrolling) 150.dp else 0.dp, animationSpec = tween(300), label = "dockSlide")
              val tabs = listOf("GALLERY", "EXPLORE", "STUDIO", "VAULT")
              val tabIcons = listOf(Icons.Default.Image, Icons.Default.Explore, Icons.Default.AutoAwesome, Icons.Default.Lock)
              val currentIdx = tabs.indexOf(screen).coerceAtLeast(0)
              val goldenColor = Color(0xFFFFD700)

              Box(modifier = modifier.offset(y = offsetY).padding(bottom = 24.dp + navBarPad).widthIn(max = 380.dp).fillMaxWidth(0.85f).height(65.dp).shadow(20.dp, RoundedCornerShape(30.dp), spotColor = Color.White.copy(alpha = 0.6f)).hazeChild(hazeState, RoundedCornerShape(30.dp), HazeStyle(tint = Color.White.copy(alpha = 0.15f), blurRadius = blurVal.dp, noiseFactor = 0.05f)), contentAlignment = Alignment.Center) {
                  BoxWithConstraints(modifier = Modifier.fillMaxSize().padding(horizontal = 4.dp)) {
                      val tabWidthDp = maxWidth / tabs.size
                      val indicatorOffset by animateDpAsState(targetValue = tabWidthDp * currentIdx, animationSpec = spring(dampingRatio = Spring.DampingRatioMediumBouncy, stiffness = Spring.StiffnessLow), label = "goldenPill")
                      Box(modifier = Modifier.offset(x = indicatorOffset).width(tabWidthDp).fillMaxHeight().padding(vertical = 10.dp, horizontal = 4.dp).shadow(15.dp, RoundedCornerShape(25.dp), spotColor = goldenColor, ambientColor = goldenColor).background(goldenColor.copy(alpha = 0.5f), RoundedCornerShape(25.dp)).border(1.5.dp, goldenColor, RoundedCornerShape(25.dp)))
                      Row(modifier = Modifier.fillMaxSize(), horizontalArrangement = Arrangement.SpaceEvenly, verticalAlignment = Alignment.CenterVertically) {
                          tabIcons.forEachIndexed { idx, icon ->
                              IconButton(onClick = { haptic.performHapticFeedback(HapticFeedbackType.LongPress); onTabSelected(tabs[idx]) }, modifier = Modifier.weight(1f)) {
                                  Icon(icon, null, tint = if (currentIdx == idx) Color.White else Color.Gray)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun AlbumFilterChips(currentMode: ViewMode, onModeChange: (ViewMode) -> Unit, hazeState: HazeState, blurVal: Float, modifier: Modifier = Modifier) {
              val haptic = LocalHapticFeedback.current
              Row(modifier = modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  listOf(Pair(ViewMode.ALL_MEDIA, "All Media"), Pair(ViewMode.ALBUMS, "Albums"), Pair(ViewMode.FAVORITES, "Favorites")).forEach { (mode, label) ->
                      Box(modifier = Modifier.hazeChild(hazeState, RoundedCornerShape(20.dp), HazeStyle(tint = if (currentMode == mode) Color(0xFFFFD700).copy(alpha = 0.2f) else Color.White.copy(alpha = 0.08f), blurRadius = blurVal.dp)).background(if (currentMode == mode) Color(0xFFFFD700).copy(alpha = 0.3f) else Color.Transparent, RoundedCornerShape(20.dp)).border(1.dp, if (currentMode == mode) Color(0xFFFFD700) else Color.Transparent, RoundedCornerShape(20.dp)).clickable { haptic.performHapticFeedback(HapticFeedbackType.LongPress); onModeChange(mode) }.padding(horizontal = 16.dp, vertical = 8.dp)) {
                          Text(label, color = if (currentMode == mode) Color(0xFFFFD700) else Color.White.copy(alpha = 0.7f), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }
                  }
              }
          }

          @Composable
          fun MediaViewerOverlay(onClose: () -> Unit, onFavorite: (Boolean) -> Unit, isFavorite: Boolean, modifier: Modifier = Modifier) {
              val haptic = LocalHapticFeedback.current
              val hazeState = remember { HazeState() }
              Box(modifier = modifier.fillMaxWidth().padding(bottom=40.dp).padding(horizontal = 16.dp).height(80.dp).hazeChild(hazeState, RoundedCornerShape(25.dp), HazeStyle(tint = Color.White.copy(alpha = 0.15f), blurRadius = 40.dp, noiseFactor = 0.05f))) {
                  Row(modifier = Modifier.fillMaxSize(), horizontalArrangement = Arrangement.SpaceEvenly, verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = { haptic.performHapticFeedback(HapticFeedbackType.LongPress); onFavorite(!isFavorite) }) { Icon(if (isFavorite) Icons.Default.Favorite else Icons.Default.FavoriteBorder, null, tint = if (isFavorite) Color(0xFFFFD700) else Color.White, modifier = Modifier.size(28.dp)) }
                      IconButton(onClick = { haptic.performHapticFeedback(HapticFeedbackType.LongPress) }) { Icon(Icons.Default.Delete, null, tint = Color.White, modifier = Modifier.size(28.dp)) }
                      IconButton(onClick = { haptic.performHapticFeedback(HapticFeedbackType.LongPress) }) { Icon(Icons.Default.Share, null, tint = Color.White, modifier = Modifier.size(28.dp)) }
                      IconButton(onClick = { haptic.performHapticFeedback(HapticFeedbackType.LongPress); onClose() }) { Icon(Icons.Default.Close, null, tint = Color.White, modifier = Modifier.size(28.dp)) }
                  }
              }
          }

          @Composable
          fun AlbumCard(album: Album) {
              Card(modifier = Modifier.fillMaxWidth().padding(8.dp).clip(RoundedCornerShape(16.dp)), colors = CardDefaults.cardColors(containerColor = Color(0xFF151515))) {
                  Column {
                      AsyncImage(model = ImageRequest.Builder(LocalContext.current).data(album.thumbnailUri).crossfade(true).build(), contentDescription = null, contentScale = ContentScale.Crop, modifier = Modifier.fillMaxWidth().height(150.dp))
                      Column(modifier = Modifier.padding(12.dp)) {
                          Text(album.bucketName, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                          Text("${album.count} items", color = Color.Gray, fontSize = 12.sp)
                      }
                  }
              }
          }

          @Composable
          fun DummyScreen(screen: String, hazeState: HazeState) {
              Column(modifier = Modifier.fillMaxSize().haze(state = hazeState).padding(top = 120.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                  Text(screen, color = Color.White, fontSize = 28.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(20.dp))
                  Text("Advanced Features Coming Soon... 💀", color = Color.Gray, fontSize = 16.sp)
                  Spacer(Modifier.weight(1f))
                  PandeyJiGlow()
                  Spacer(Modifier.height(110.dp))
              }
          }

          @Composable
          fun SettingsHub(blurVal: Float, onBlurChange: (Float) -> Unit, hazeState: HazeState) {
              Column(modifier = Modifier.fillMaxSize().haze(state = hazeState).padding(24.dp).padding(top = 110.dp, bottom = 100.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                  Text("AURA SETTINGS", color = Color.White, fontSize = 26.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(30.dp))
                  Text("Liquid Glass Blur Level: ${blurVal.toInt()}", color = Color.Gray)
                  Slider(value = blurVal, onValueChange = onBlurChange, valueRange = 10f..80f, colors = SliderDefaults.colors(thumbColor = Color.White, activeTrackColor = Color.White))
                  Spacer(Modifier.height(20.dp))
                  Button(onClick = { }, modifier = Modifier.fillMaxWidth().height(50.dp), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF151515))) { Text("Setup Secure Vault PIN", color = Color.White) }
                  Spacer(Modifier.weight(1f))
                  PandeyJiGlow()
              }
          }
          EOF

          # 🔥 THE MAIN ENGINE (Scoping and Lifecycle Fixed) 🔥
          cat << 'EOF' > app/src/main/java/com/aura/gallery/MainActivity.kt
          @file:OptIn(androidx.compose.foundation.ExperimentalFoundationApi::class)
          package com.aura.gallery

          import android.Manifest
          import android.app.Activity
          import android.content.*
          import android.os.*
          import android.provider.MediaStore
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.gestures.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.*
          import androidx.compose.foundation.pager.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.*
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.hapticfeedback.HapticFeedbackType
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.*
          import androidx.compose.ui.unit.*
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.core.view.*
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleEventObserver
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView
          import coil.compose.AsyncImage
          import coil.request.ImageRequest
          import dev.chrisbanes.haze.*
          import kotlinx.coroutines.*
          import kotlin.math.*

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  setContent { AuraApp() }
              }
          }

          @Composable
          fun AuraApp() {
              val context = LocalContext.current
              val view = LocalView.current
              val window = (context as Activity).window
              var mediaList by remember { mutableStateOf<List<Media>>(emptyList()) }
              var albumList by remember { mutableStateOf<List<Album>>(emptyList()) }
              var hasPerm by remember { mutableStateOf(false) }
              var screen by remember { mutableStateOf("GALLERY") }
              var viewMode by remember { mutableStateOf(ViewMode.ALL_MEDIA) }
              var selIndex by remember { mutableStateOf(0) }
              var isFullScreen by remember { mutableStateOf(false) }
              var blurVal by remember { mutableStateOf(40f) }
              val hazeState = remember { HazeState() }
              val gridState = rememberLazyGridState()

              if (isFullScreen) BackHandler { isFullScreen = false }
              else if (screen != "GALLERY") BackHandler { screen = "GALLERY" }

              val launcher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { hasPerm = it.values.all { true } }
              LaunchedEffect(Unit) {
                  if (Build.VERSION.SDK_INT >= 33) launcher.launch(arrayOf(Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO))
                  else launcher.launch(arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE))
              }
              
              LaunchedEffect(hasPerm) {
                  if (hasPerm) {
                      withContext(Dispatchers.IO) {
                          val uri = MediaStore.Files.getContentUri("external")
                          val proj = arrayOf(MediaStore.Files.FileColumns._ID, MediaStore.Files.FileColumns.DATA, MediaStore.Files.FileColumns.MEDIA_TYPE, MediaStore.Files.FileColumns.BUCKET_ID, MediaStore.Files.FileColumns.BUCKET_DISPLAY_NAME)
                          val sel = "${MediaStore.Files.FileColumns.MEDIA_TYPE}=? OR ${MediaStore.Files.FileColumns.MEDIA_TYPE}=?"
                          val args = arrayOf(MediaStore.Files.FileColumns.MEDIA_TYPE_IMAGE.toString(), MediaStore.Files.FileColumns.MEDIA_TYPE_VIDEO.toString())
                          val cursor = context.contentResolver.query(uri, proj, sel, args, "${MediaStore.Files.FileColumns.DATE_ADDED} DESC")
                          val media = mutableListOf<Media>()
                          val albumsMap = mutableMapOf<Long, Album>()
                          
                          cursor?.use { c ->
                              val idCol = c.getColumnIndexOrThrow(MediaStore.Files.FileColumns._ID)
                              val typeCol = c.getColumnIndexOrThrow(MediaStore.Files.FileColumns.MEDIA_TYPE)
                              val bucketIdCol = c.getColumnIndexOrThrow(MediaStore.Files.FileColumns.BUCKET_ID)
                              val bucketNameCol = c.getColumnIndexOrThrow(MediaStore.Files.FileColumns.BUCKET_DISPLAY_NAME)
                              
                              while (c.moveToNext()) {
                                  val id = c.getLong(idCol)
                                  val type = c.getInt(typeCol)
                                  val bId = c.getLong(bucketIdCol)
                                  val bName = c.getString(bucketNameCol) ?: "Camera"
                                  val contentUri = ContentUris.withAppendedId(MediaStore.Files.getContentUri("external"), id).toString()
                                  
                                  media.add(Media(uri = contentUri, isVideo = type == MediaStore.Files.FileColumns.MEDIA_TYPE_VIDEO, bucketName = bName, bucketId = bId))
                                  
                                  if (!albumsMap.containsKey(bId)) {
                                      albumsMap[bId] = Album(bId, bName, contentUri, 1, 0L)
                                  } else {
                                      albumsMap[bId] = albumsMap[bId]!!.copy(count = albumsMap[bId]!!.count + 1)
                                  }
                              }
                          }
                          mediaList = media
                          albumList = albumsMap.values.toList()
                      }
                  }
              }

              DisposableEffect(isFullScreen) {
                  if (isFullScreen) {
                      window.addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      WindowCompat.getInsetsController(window, view).apply { hide(WindowInsetsCompat.Type.systemBars()); systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE }
                  } else {
                      window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      WindowCompat.getInsetsController(window, view).show(WindowInsetsCompat.Type.systemBars())
                  }
                  onDispose { window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); WindowCompat.getInsetsController(window, view).show(WindowInsetsCompat.Type.systemBars()) }
              }

              Box(modifier = Modifier.fillMaxSize().background(Color(0xFF050505))) {
                  if (!isFullScreen) {
                      when (screen) {
                          "GALLERY" -> {
                              val navBarPad = WindowInsets.navigationBars.asPaddingValues().calculateBottomPadding()
                              Box(modifier = Modifier.fillMaxSize()) {
                                  when (viewMode) {
                                      ViewMode.ALL_MEDIA -> {
                                          LazyVerticalGrid(state = gridState, columns = GridCells.Fixed(4), modifier = Modifier.fillMaxSize().haze(state = hazeState), contentPadding = PaddingValues(top = 160.dp, bottom = 130.dp + navBarPad)) { 
                                              itemsIndexed(mediaList) { index, m -> 
                                                  Box(modifier = Modifier.aspectRatio(1f).padding(1.dp).clickable { selIndex = index; isFullScreen = true }, contentAlignment = Alignment.Center) {
                                                      AsyncImage(model = ImageRequest.Builder(LocalContext.current).data(m.uri).crossfade(true).build(), contentDescription = null, contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize())
                                                      if (m.isVideo) Icon(Icons.Default.PlayArrow, null, tint = Color.White, modifier = Modifier.size(26.dp).shadow(4.dp))
                                                  }
                                              } 
                                          }
                                      }
                                      ViewMode.ALBUMS -> {
                                          LazyVerticalGrid(columns = GridCells.Fixed(2), modifier = Modifier.fillMaxSize().haze(state = hazeState), contentPadding = PaddingValues(top = 160.dp, bottom = 130.dp + navBarPad, start = 8.dp, end = 8.dp)) {
                                              items(albumList.size) { i -> AlbumCard(albumList[i]) }
                                          }
                                      }
                                      ViewMode.FAVORITES -> {
                                          val favs = mediaList.filter { it.isFavorite }
                                          LazyVerticalGrid(columns = GridCells.Fixed(4), modifier = Modifier.fillMaxSize().haze(state = hazeState), contentPadding = PaddingValues(top = 160.dp, bottom = 130.dp + navBarPad)) {
                                              itemsIndexed(favs) { idx, m -> 
                                                  Box(modifier = Modifier.aspectRatio(1f).padding(1.dp).clickable { selIndex = mediaList.indexOf(m); isFullScreen = true }, contentAlignment = Alignment.Center) {
                                                      AsyncImage(model = ImageRequest.Builder(LocalContext.current).data(m.uri).crossfade(true).build(), contentDescription = null, contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize())
                                                      Icon(Icons.Default.Favorite, null, tint = Color(0xFFFFD700), modifier = Modifier.size(20.dp).shadow(4.dp))
                                                  }
                                              }
                                          }
                                      }
                                  }
                                  AlbumFilterChips(currentMode = viewMode, onModeChange = { viewMode = it }, hazeState = hazeState, blurVal = blurVal, modifier = Modifier.align(Alignment.TopCenter).padding(top = 100.dp))
                              }
                          }
                          "SETTINGS" -> SettingsHub(blurVal, { blurVal = it }, hazeState)
                          else -> DummyScreen(screen, hazeState)
                      }
                  } else if (mediaList.isNotEmpty()) {
                      val pagerState = rememberPagerState(initialPage = selIndex) { mediaList.size }
                      HorizontalPager(state = pagerState, modifier = Modifier.fillMaxSize()) { page ->
                          MediaViewer(
                              mediaList[page], 
                              onBack = { isFullScreen = false }, 
                              isFavorite = mediaList[page].isFavorite, 
                              onFavoriteToggle = { fav -> 
                                  val newList = mediaList.toMutableList()
                                  newList[page] = newList[page].copy(isFavorite = fav)
                                  mediaList = newList
                              }
                          )
                      }
                  }
                  
                  if (!isFullScreen) {
                      TopBar(screen, hazeState, blurVal, gridState.isScrollInProgress, Modifier.align(Alignment.TopCenter)) { screen = if (screen == "SETTINGS") "GALLERY" else "SETTINGS" }
                      BottomDock(screen, hazeState, blurVal, gridState.isScrollInProgress, Modifier.align(Alignment.BottomCenter)) { screen = it; viewMode = ViewMode.ALL_MEDIA }
                  }
              }
          }

          @Composable
          fun MediaViewer(media: Media, onBack: () -> Unit, isFavorite: Boolean, onFavoriteToggle: (Boolean) -> Unit) {
              val context = LocalContext.current
              val haptic = LocalHapticFeedback.current
              var scale by remember { mutableFloatStateOf(1f) }
              var offset by remember { mutableStateOf(Offset.Zero) }
              var dragOffsetY by remember { mutableFloatStateOf(0f) }
              val bgAlpha by animateFloatAsState(1f - (abs(dragOffsetY) / 800f).coerceIn(0f, 1f), label = "a")
              var showOverlay by remember { mutableStateOf(true) }

              Box(modifier = Modifier.fillMaxSize().background(Color.Black.copy(alpha = bgAlpha))
                  .pointerInput(Unit) {
                      detectTapGestures(
                          onDoubleTap = { if (scale > 1f) { scale = 1f; offset = Offset.Zero } else { scale = 3f; offset = Offset.Zero } },
                          onTap = { showOverlay = !showOverlay }
                      )
                  }.pointerInput(Unit) {
                      detectTransformGestures { _, pan, zoom, _ ->
                          scale = (scale * zoom).coerceIn(1f, 5f)
                          val maxX = (size.width * (scale - 1)) / 2f
                          val maxY = (size.height * (scale - 1)) / 2f
                          if (scale > 1f) offset = Offset((offset.x + pan.x).coerceIn(-maxX, maxX), (offset.y + pan.y).coerceIn(-maxY, maxY)) else offset = Offset.Zero
                      }
                  }.pointerInput(Unit) {
                      detectVerticalDragGestures(
                          onDragEnd = { if (scale == 1f) { if (dragOffsetY > 250f || dragOffsetY < -250f) { haptic.performHapticFeedback(HapticFeedbackType.LongPress); onBack() } else dragOffsetY = 0f } },
                          onVerticalDrag = { change, amount -> if (scale == 1f) { change.consume(); dragOffsetY += amount } }
                      )
                  }, contentAlignment = Alignment.Center) {
                  
                  val mod = Modifier.fillMaxSize().offset { IntOffset(0, dragOffsetY.roundToInt()) }.graphicsLayer(scaleX = scale, scaleY = scale, translationX = offset.x, translationY = offset.y)
                  
                  if (media.isVideo) {
                      val exoPlayer = remember { ExoPlayer.Builder(context).build().apply { setMediaItem(MediaItem.fromUri(media.uri)); prepare(); playWhenReady = true } }
                      val lifecycleOwner = androidx.compose.ui.platform.LocalLifecycleOwner.current
                      DisposableEffect(lifecycleOwner) {
                          val observer = LifecycleEventObserver { _, event -> if (event == Lifecycle.Event.ON_PAUSE) exoPlayer.pause() else if (event == Lifecycle.Event.ON_RESUME) exoPlayer.play() }
                          lifecycleOwner.lifecycle.addObserver(observer)
                          onDispose { lifecycleOwner.lifecycle.removeObserver(observer); exoPlayer.release() }
                      }
                      AndroidView(factory = { ctx -> PlayerView(ctx).apply { player = exoPlayer; useController = true } }, modifier = mod)
                  } else {
                      AsyncImage(model = ImageRequest.Builder(context).data(media.uri).crossfade(true).build(), contentDescription = null, contentScale = ContentScale.Fit, modifier = mod)
                  }

                  if (showOverlay && scale == 1f) {
                      MediaViewerOverlay(onClose = onBack, onFavorite = onFavoriteToggle, isFavorite = isFavorite, modifier = Modifier.align(Alignment.BottomCenter))
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true 

      - name: Compile and Build APK
        run: gradle assembleDebug --no-daemon --refresh-dependencies --stacktrace

      - name: Upload Final APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuraGallery-APK
          path: app/build/outputs/apk/debug/app-debug.apk
