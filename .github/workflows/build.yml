          @Composable
          fun MediaPagerScreen(mediaList: List<Media>, initialIndex: Int, onBack: () -> Unit, onFavoriteToggle: (Int, Boolean) -> Unit) {
              val pagerState = rememberPagerState(initialPage = initialIndex) { mediaList.size }
              HorizontalPager(state = pagerState, modifier = Modifier.fillMaxSize(), userScrollEnabled = true) { page ->
                  MediaViewer(mediaList[page], onBack, isFavorite = mediaList[page].isFavorite, onFavoriteToggle = { onFavoriteToggle(page, it) })
              }
          }

          @Composable
          fun MediaViewer(media: Media, onBack: () -> Unit, isFavorite: Boolean = false, onFavoriteToggle: (Boolean) -> Unit = {}) {
              val context = LocalContext.current
              val haptic = LocalHapticFeedback.current
              
              var scale by remember { mutableFloatStateOf(1f) }
              var offset by remember { mutableStateOf(Offset.Zero) }
              var showOverlay by remember { mutableStateOf(true) }
              var isFavoritedLocal by remember { mutableStateOf(isFavorite) }
              
              // Smooth Zoom state
              val state = rememberTransformableState { zoomChange, offsetChange, _ ->
                  scale = (scale * zoomChange).coerceIn(1f, 5f)
                  if (scale > 1f) {
                      offset += offsetChange
                  } else {
                      offset = Offset.Zero
                  }
              }

              Box(modifier = Modifier.fillMaxSize().background(Color.Black), contentAlignment = Alignment.Center) {
                  val mod = Modifier.fillMaxSize()
                      .graphicsLayer(scaleX = scale, scaleY = scale, translationX = offset.x, translationY = offset.y)
                      .transformable(state = state)
                      .pointerInput(Unit) {
                          detectTapGestures(
                              onDoubleTap = { 
                                  scale = if (scale > 1f) 1f else 3f
                                  offset = Offset.Zero 
                              },
                              onTap = { showOverlay = !showOverlay }
                          )
                      }
                      // Allow 1-finger panning ONLY when zoomed in
                      .pointerInput(scale) {
                          if (scale > 1f) {
                              detectDragGestures { change, dragAmount ->
                                  change.consume()
                                  offset += dragAmount
                              }
                          }
                      }
                  
                  if (media.isVideo) {
                      val exoPlayer = remember { ExoPlayer.Builder(context).build().apply { setMediaItem(MediaItem.fromUri(media.uri)); prepare(); playWhenReady = true } }
                      val lifecycleOwner = androidx.compose.ui.platform.LocalLifecycleOwner.current
                      DisposableEffect(lifecycleOwner) {
                          val observer = LifecycleEventObserver { _, event -> 
                              if (event == Lifecycle.Event.ON_RESUME) { exoPlayer.play() } 
                              else if (event == Lifecycle.Event.ON_PAUSE) { exoPlayer.pause() } 
                          }
                          lifecycleOwner.lifecycle.addObserver(observer)
                          onDispose { lifecycleOwner.lifecycle.removeObserver(observer); exoPlayer.release() }
                      }
                      AndroidView(factory = { ctx -> PlayerView(ctx).apply { player = exoPlayer; useController = true; layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT) } }, modifier = mod)
                  } else {
                      AsyncImage(model = ImageRequest.Builder(context).data(media.uri).crossfade(true).build(), contentDescription = null, contentScale = ContentScale.Fit, modifier = mod)
                  }
                  
                  // Top Status Gradient for Immersive mode visibility
                  if (showOverlay && scale == 1f) {
                      Box(modifier = Modifier.fillMaxWidth().height(80.dp).align(Alignment.TopCenter).background(Brush.verticalGradient(listOf(Color.Black.copy(alpha = 0.5f), Color.Transparent))))
                      MediaViewerOverlay(onClose = onBack, onFavorite = { isFavoritedLocal = it; onFavoriteToggle(it) }, isFavorite = isFavoritedLocal, modifier = Modifier.align(Alignment.BottomCenter))
                  }
              }
          }

          @Composable
          fun MediaViewerOverlay(onClose: () -> Unit, onFavorite: (Boolean) -> Unit, isFavorite: Boolean, modifier: Modifier = Modifier) {
              val haptic = LocalHapticFeedback.current
              val hazeState = remember { HazeState() }
              Box(modifier = modifier.fillMaxWidth().height(80.dp).padding(16.dp).hazeChild(state = hazeState, shape = RoundedCornerShape(20.dp), style = HazeStyle(tint = Color.White.copy(alpha = 0.15f), blurRadius = 30.dp, noiseFactor = 0.05f))) {
                  Row(modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp), horizontalArrangement = Arrangement.SpaceEvenly, verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = { haptic.performHapticFeedback(HapticFeedbackType.LongPress); onFavorite(!isFavorite) }) { Icon(if (isFavorite) Icons.Default.Favorite else Icons.Default.FavoriteBorder, null, tint = if (isFavorite) Color(0xFFFFD700) else Color.White, modifier = Modifier.size(28.dp)) }
                      IconButton(onClick = { haptic.performHapticFeedback(HapticFeedbackType.LongPress) }) { Icon(Icons.Default.Delete, null, tint = Color.White, modifier = Modifier.size(28.dp)) }
                      IconButton(onClick = { haptic.performHapticFeedback(HapticFeedbackType.LongPress) }) { Icon(Icons.Default.Share, null, tint = Color.White, modifier = Modifier.size(28.dp)) }
                      IconButton(onClick = { haptic.performHapticFeedback(HapticFeedbackType.LongPress); onClose() }) { Icon(Icons.Default.Close, null, tint = Color.White, modifier = Modifier.size(28.dp)) }
                  }
              }
          }

          // PREMIUM KSU STYLE FLOATING BUTTON
          @Composable
          fun KSUStyleFloatingButton(modifier: Modifier = Modifier, onClick: () -> Unit = {}) {
              val haptic = LocalHapticFeedback.current
              Box(modifier = modifier.padding(16.dp).size(60.dp).shadow(16.dp, RoundedCornerShape(20.dp), spotColor = Color(0xFFFFD700)).background(Color(0xFF1A1A1A), RoundedCornerShape(20.dp)).border(1.dp, Color.White.copy(alpha = 0.15f), RoundedCornerShape(20.dp)).clickable { haptic.performHapticFeedback(HapticFeedbackType.LongPress); onClick() }, contentAlignment = Alignment.Center) {
                  Icon(Icons.Default.AutoAwesome, contentDescription = "Studio", tint = Color(0xFFFFD700), modifier = Modifier.size(28.dp))
              }
          }

          @Composable
          fun DummyScreen(screen: String, hazeState: HazeState) {
              Box(modifier = Modifier.fillMaxSize().haze(state = hazeState), contentAlignment = Alignment.Center) { Text("$screen Screen - Coming Soon", color = Color.White, fontSize = 24.sp) }
          }
          EOF

          # 🔥 FILE 3: MAIN ACTIVITY (IMMERSIVE MODE FIXED) 🔥
          cat << 'EOF' > app/src/main/java/com/pandeyji/aura/gallery/MainActivity.kt
          package com.pandeyji.aura.gallery

          import android.Manifest
          import android.app.Activity
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.LazyGridState
          import androidx.compose.foundation.lazy.grid.rememberLazyGridState
          import androidx.compose.material3.AlertDialog
          import androidx.compose.material3.Button
          import androidx.compose.material3.ButtonDefaults
          import androidx.compose.material3.Scaffold
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalView
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.window.DialogProperties
          import androidx.core.content.ContextCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import dev.chrisbanes.haze.HazeState
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          class MainActivity : ComponentActivity() {
              private val permissionLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { isGranted -> updatePermissionStatus(isGranted) }
              private var onPermissionResult: ((Boolean) -> Unit)? = null
              private fun requestPermission() {
                  val permission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) Manifest.permission.READ_MEDIA_IMAGES else Manifest.permission.READ_EXTERNAL_STORAGE
                  permissionLauncher.launch(permission)
              }
              private fun updatePermissionStatus(isGranted: Boolean) { onPermissionResult?.invoke(isGranted) }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  val hasPermission = ContextCompat.checkSelfPermission(this, if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) Manifest.permission.READ_MEDIA_IMAGES else Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED
                  setContent { AuraGalleryApp(hasInitialPermission = hasPermission, onRequestPermission = { callback -> onPermissionResult = callback; requestPermission() }) }
              }
          }

          @Composable
          fun AuraGalleryApp(hasInitialPermission: Boolean, onRequestPermission: ((Boolean) -> Unit) -> Unit) {
              var hasPerm by remember { mutableStateOf(hasInitialPermission) }
              var mediaList by remember { mutableStateOf<List<Media>>(emptyList()) }
              var albumList by remember { mutableStateOf<List<Album>>(emptyList()) }
              var screen by remember { mutableStateOf("GALLERY") }
              var selIndex by remember { mutableStateOf(0) }
              var isFullScreen by remember { mutableStateOf(false) }
              var blurVal by remember { mutableFloatStateOf(40f) }
              val gridState = rememberLazyGridState()
              var viewMode by remember { mutableStateOf(ViewMode.ALL_MEDIA) }
              val hazeState = remember { HazeState() }
              val context = LocalContext.current

              // IMMERSIVE MODE STATUS BAR AUTO-HIDE LOGIC
              val view = LocalView.current
              val window = (context as Activity).window
              DisposableEffect(isFullScreen) {
                  val insetsController = WindowCompat.getInsetsController(window, view)
                  if (isFullScreen) {
                      insetsController.hide(WindowInsetsCompat.Type.systemBars())
                      insetsController.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  } else {
                      insetsController.show(WindowInsetsCompat.Type.systemBars())
                  }
                  onDispose { insetsController.show(WindowInsetsCompat.Type.systemBars()) }
              }

              LaunchedEffect(hasPerm) {
                  if (hasPerm) {
                      withContext(Dispatchers.IO) {
                          val media = mutableListOf<Media>()
                          val albums = mutableMapOf<Long, Album>()
                          val cursor = context.contentResolver.query(MediaStore.Files.getContentUri("external"), arrayOf(MediaStore.Files.FileColumns._ID, MediaStore.Files.FileColumns.DATA, MediaStore.Files.FileColumns.MEDIA_TYPE, MediaStore.Files.FileColumns.BUCKET_ID, MediaStore.Files.FileColumns.BUCKET_DISPLAY_NAME, MediaStore.Files.FileColumns.DATE_MODIFIED, MediaStore.Files.FileColumns.DISPLAY_NAME), "${MediaStore.Files.FileColumns.MEDIA_TYPE} = ? OR ${MediaStore.Files.FileColumns.MEDIA_TYPE} = ?", arrayOf(MediaStore.Files.FileColumns.MEDIA_TYPE_IMAGE.toString(), MediaStore.Files.FileColumns.MEDIA_TYPE_VIDEO.toString()), "${MediaStore.Files.FileColumns.DATE_MODIFIED} DESC")
                          cursor?.use {
                              val idCol = it.getColumnIndex(MediaStore.Files.FileColumns._ID)
                              val typeCol = it.getColumnIndex(MediaStore.Files.FileColumns.MEDIA_TYPE)
                              val bucketIdCol = it.getColumnIndex(MediaStore.Files.FileColumns.BUCKET_ID)
                              val bucketNameCol = it.getColumnIndex(MediaStore.Files.FileColumns.BUCKET_DISPLAY_NAME)
                              val dateCol = it.getColumnIndex(MediaStore.Files.FileColumns.DATE_MODIFIED)
                              val nameCol = it.getColumnIndex(MediaStore.Files.FileColumns.DISPLAY_NAME)
                              while (it.moveToNext()) {
                                  val id = it.getLong(idCol)
                                  val type = it.getInt(typeCol)
                                  val bucketId = it.getLong(bucketIdCol)
                                  val bucketName = it.getString(bucketNameCol) ?: "Camera"
                                  val timestamp = it.getLong(dateCol)
                                  val displayName = it.getString(nameCol)
                                  val uri = if (type == MediaStore.Files.FileColumns.MEDIA_TYPE_IMAGE) MediaStore.Images.Media.EXTERNAL_CONTENT_URI.buildUpon().appendPath(id.toString()).build().toString() else MediaStore.Video.Media.EXTERNAL_CONTENT_URI.buildUpon().appendPath(id.toString()).build().toString()
                                  media.add(Media(uri = uri, isVideo = type == MediaStore.Files.FileColumns.MEDIA_TYPE_VIDEO, bucketName = bucketName, bucketId = bucketId, timestamp = timestamp, displayName = displayName ?: ""))
                                  if (!albums.containsKey(bucketId)) albums[bucketId] = Album(bucketId = bucketId, bucketName = bucketName, thumbnailUri = uri, count = 1, lastModified = timestamp) else albums[bucketId] = albums[bucketId]!!.copy(count = albums[bucketId]!!.count + 1)
                              }
                          }
                          mediaList = media
                          albumList = albums.values.toList()
                      }
                  }
              }

              if (!hasPerm) {
                  AlertDialog(onDismissRequest = { }, title = { Text("Permission Required", color = Color.White) }, text = { Text("Aura Gallery needs access to your photos and videos", color = Color.White) }, confirmButton = { Button(onClick = { onRequestPermission { hasPerm = it } }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFFD700))) { Text("Grant", color = Color.Black) } }, containerColor = Color(0xFF1a1a1a), properties = DialogProperties(dismissOnBackPress = false, dismissOnClickOutside = false))
              } else {
                  Box(modifier = Modifier.fillMaxSize().background(Color(0xFF050505))) {
                      if (isFullScreen && mediaList.isNotEmpty()) {
                          Box(modifier = Modifier.fillMaxSize()) {
                              MediaPagerScreen(mediaList, selIndex, onBack = { isFullScreen = false }, onFavoriteToggle = { index, isFav -> mediaList = mediaList.toMutableList().apply { this[index] = this[index].copy(isFavorite = isFav) } })
                          }
                      } else {
                          Scaffold(modifier = Modifier.fillMaxSize(), containerColor = Color(0xFF050505)) { innerPadding ->
                              Box(modifier = Modifier.fillMaxSize().padding(innerPadding)) {
                                  if (screen == "GALLERY") { AlbumFilterChips(currentMode = viewMode, onModeChange = { viewMode = it }, hazeState = hazeState, blurVal = blurVal, modifier = Modifier.align(Alignment.TopCenter).padding(top = 100.dp)) }
                                  when (screen) {
                                      "GALLERY" -> { GalleryGrid(mediaList = mediaList, hasPerm = hasPerm, hazeState = hazeState, gridState = gridState, viewMode = viewMode, albums = albumList, onMediaClick = { idx -> selIndex = idx; isFullScreen = true }) }
                                      "EXPLORE" -> DummyScreen("EXPLORE", hazeState)
                                      "STUDIO" -> DummyScreen("AI STUDIO", hazeState)
                                      "VAULT" -> DummyScreen("VAULT", hazeState)
                                      "SETTINGS" -> SettingsHub(blurVal, { blurVal = it }, hazeState)
                                  }
                                  if (!isFullScreen) {
                                      TopBar(screen = screen, hazeState = hazeState, blurVal = blurVal, isScrolling = gridState.isScrollInProgress, modifier = Modifier.align(Alignment.TopCenter), onProfileClick = { screen = if (screen == "SETTINGS") "GALLERY" else "SETTINGS" }, onSearchChange = { })
                                      BottomDock(screen = screen, hazeState = hazeState, blurVal = blurVal, isScrolling = gridState.isScrollInProgress, modifier = Modifier.align(Alignment.BottomCenter), onScreenChange = { screen = it; viewMode = ViewMode.ALL_MEDIA })
                                  }
                                  if (screen == "GALLERY" && !isFullScreen) {
                                      KSUStyleFloatingButton(modifier = Modifier.align(Alignment.BottomEnd).padding(end = 12.dp, bottom = 100.dp), onClick = { })
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun PermissionDialog(onGrantPermission: () -> Unit) {
              AlertDialog(onDismissRequest = { }, title = { Text("Permission Required", color = Color.White) }, text = { Text("Aura Gallery needs access to your photos and videos", color = Color.White) }, confirmButton = { Button(onClick = onGrantPermission, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFFD700))) { Text("Grant Permission", color = Color.Black) } }, containerColor = Color(0xFF1a1a1a), properties = DialogProperties(dismissOnBackPress = false, dismissOnClickOutside = false))
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true 

      - name: Compile and Build APK
        run: gradle assembleDebug --no-daemon --refresh-dependencies --stacktrace

      - name: Upload Final APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuraGallery-APK
          path: app/build/outputs/apk/debug/app-debug.apk
