          fun TopBar(screen: String, hazeState: HazeState, blurVal: Float, isScrolling: Boolean, modifier: Modifier, onProfileClick: () -> Unit, onSearchChange: (String) -> Unit) {
              val haptic = LocalHapticFeedback.current
