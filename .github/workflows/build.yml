name: Aura Gallery (God Mode V12 - Phase 1) 💀🔥

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android Project from Scratch 🪄
        run: |
          mkdir -p app/src/main/java/com/aura/gallery
          mkdir -p app/src/main/res/values

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Aura Gallery"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.3.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.23" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android { namespace = "com.aura.gallery"; compileSdk = 34; defaultConfig { applicationId = "com.aura.gallery"; minSdk = 31; targetSdk = 34; versionCode = 1; versionName = "1.0" }; buildFeatures { compose = true }; composeOptions { kotlinCompilerExtensionVersion = "1.5.11" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }
          dependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.activity:activity-compose:1.8.2"); implementation(platform("androidx.compose:compose-bom:2024.02.00")); implementation("androidx.compose.ui:ui"); implementation("androidx.compose.material3:material3"); implementation("dev.chrisbanes.haze:haze:0.6.0"); implementation("io.coil-kt:coil-compose:2.6.0") }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <application android:allowBackup="true" android:label="Aura Gallery" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">Aura Gallery</string></resources>
          EOF

          # V12 MONSTER ENGINE (PHASE 1 BLUEPRINT)
          cat << 'EOF' > app/src/main/java/com/aura/gallery/MainActivity.kt
          package com.aura.gallery
          import android.Manifest
          import android.content.ContentUris
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.draw.shadow
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Shadow
          import androidx.compose.ui.hapticfeedback.HapticFeedbackType
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalHapticFeedback
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.view.WindowCompat
          import coil.compose.AsyncImage
          import dev.chrisbanes.haze.HazeState
          import dev.chrisbanes.haze.haze
          import dev.chrisbanes.haze.hazeChild
          import dev.chrisbanes.haze.HazeStyle
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import kotlin.math.roundToInt

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)

                  setContent {
                      val context = LocalContext.current
                      val haptic = LocalHapticFeedback.current
                      
                      var photos by remember { mutableStateOf<List<String>>(emptyList()) }
                      var hasPermission by remember { mutableStateOf(false) }
                      var activeScreen by remember { mutableStateOf("GALLERY") } 
                      var selectedPhotoUri by remember { mutableStateOf("") }

                      if (activeScreen != "GALLERY") {
                          BackHandler { activeScreen = "GALLERY" }
                      }

                      val permissionLauncher = rememberLauncherForActivityResult(
                          ActivityResultContracts.RequestPermission()
                      ) { isGranted -> hasPermission = isGranted }

                      LaunchedEffect(Unit) {
                          val permission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              Manifest.permission.READ_MEDIA_IMAGES
                          } else {
                              Manifest.permission.READ_EXTERNAL_STORAGE
                          }
                          permissionLauncher.launch(permission)
                      }

                      LaunchedEffect(hasPermission) {
                          if (hasPermission) {
                              withContext(Dispatchers.IO) {
                                  val projection = arrayOf(MediaStore.Images.Media._ID)
                                  val sortOrder = "${MediaStore.Images.Media.DATE_ADDED} DESC"
                                  val query = context.contentResolver.query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, projection, null, null, sortOrder)
                                  val loadedPhotos = mutableListOf<String>()
                                  query?.use { cursor ->
                                      val idColumn = cursor.getColumnIndexOrThrow(MediaStore.Images.Media._ID)
                                      while (cursor.moveToNext()) {
                                          loadedPhotos.add(ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cursor.getLong(idColumn)).toString())
                                      }
                                  }
                                  photos = loadedPhotos
                              }
                          }
                      }

                      val hazeState = remember { HazeState() }
                      
                      Box(modifier = Modifier.fillMaxSize().background(Color(0xFF050505))) {
                          
                          if (activeScreen == "GALLERY") {
                              if (photos.isEmpty() && hasPermission) {
                                  CircularProgressIndicator(modifier = Modifier.align(Alignment.Center), color = Color.White)
                              } else {
                                  LazyVerticalGrid(
                                      columns = GridCells.Fixed(4),
                                      modifier = Modifier.fillMaxSize().haze(state = hazeState),
                                      contentPadding = PaddingValues(top = 110.dp, bottom = 120.dp) // Added top padding for search bar
                                  ) {
                                      items(photos) { uri ->
                                          AsyncImage(
                                              model = uri, contentDescription = "Photo", contentScale = ContentScale.Crop,
                                              modifier = Modifier.aspectRatio(1f).padding(1.dp)
                                                  .clickable { 
                                                      selectedPhotoUri = uri
                                                      activeScreen = "PHOTO"
                                                  }
                                          )
                                      }
                                  }
                              }
                          }

                          // DUMMY SCREEN FOR OTHER TABS TO SHOW PANDEY JI TAG
                          if (activeScreen == "EXPLORE" || activeScreen == "STUDIO" || activeScreen == "VAULT") {
                              Column(
                                  modifier = Modifier.fillMaxSize().haze(state = hazeState).padding(24.dp).padding(top = 100.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  Text(activeScreen, color = Color.White, fontSize = 28.sp, fontWeight = FontWeight.Bold, letterSpacing = 2.sp)
                                  Spacer(modifier = Modifier.height(20.dp))
                                  Text("Coming in Phase 2... 💀", color = Color.Gray, fontSize = 16.sp)
                                  
                                  Spacer(modifier = Modifier.weight(1f))
                                  
                                  // PANDEY JI GLOW 👑
                                  val infiniteTransition = rememberInfiniteTransition(label = "glow")
                                  val glowAlpha by infiniteTransition.animateFloat(
                                      initialValue = 0.2f, targetValue = 1f,
                                      animationSpec = infiniteRepeatable(tween(1500, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                                      label = "alpha"
                                  )
                                  Text(
                                      text = "Developed By Pandey Ji 👑",
                                      color = Color(0xFFFFD700).copy(alpha = glowAlpha),
                                      style = TextStyle(shadow = Shadow(color = Color(0xFFFFD700), blurRadius = 30f * glowAlpha)),
                                      fontSize = 18.sp, fontWeight = FontWeight.ExtraBold, letterSpacing = 1.sp
                                  )
                                  Spacer(modifier = Modifier.height(110.dp))
                              }
                          }

                          // FULL SCREEN PHOTO WITH SWIPE GESTURES
                          if (activeScreen == "PHOTO") {
                              var offsetY by remember { mutableStateOf(0f) }
                              val scale by animateFloatAsState(targetValue = if (offsetY > 50f || offsetY < -50f) 0.85f else 1f, label = "scale")
                              val bgAlpha by animateFloatAsState(targetValue = 1f - (Math.abs(offsetY) / 800f).coerceIn(0f, 1f), label = "alpha")

                              Box(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .background(Color.Black.copy(alpha = bgAlpha))
                                      .pointerInput(Unit) {
                                          detectDragGestures(
                                              onDragEnd = {
                                                  if (offsetY > 250f) {
                                                      // Swipe Down to Close
                                                      haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                                                      activeScreen = "GALLERY"
                                                  } else if (offsetY < -250f) {
                                                      // Swipe Up for Quick Share! 🚀
                                                      haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                                                      val shareIntent = Intent(Intent.ACTION_SEND).apply {
                                                          type = "image/*"
                                                          putExtra(Intent.EXTRA_STREAM, Uri.parse(selectedPhotoUri))
                                                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                                      }
                                                      context.startActivity(Intent.createChooser(shareIntent, "Share Aura Photo"))
                                                      activeScreen = "GALLERY"
                                                  }
                                                  offsetY = 0f
                                              },
                                              onDrag = { change, dragAmount ->
                                                  change.consume()
                                                  offsetY += dragAmount.y
                                              }
                                          )
                                      },
                                  contentAlignment = Alignment.Center
                              ) {
                                  AsyncImage(
                                      model = selectedPhotoUri,
                                      contentDescription = "Full Screen",
                                      contentScale = ContentScale.Fit,
                                      modifier = Modifier.fillMaxSize().offset { IntOffset(0, offsetY.roundToInt()) }.scale(scale)
                                  )
                              }
                          }

                          // TOP HEADER: SMART SEARCH BAR
                          if (activeScreen != "PHOTO") {
                              Box(
                                  modifier = Modifier
                                      .align(Alignment.TopCenter)
                                      .padding(top = 40.dp, start = 24.dp, end = 24.dp)
                                      .fillMaxWidth()
                                      .height(55.dp)
                                      .shadow(elevation = 10.dp, shape = RoundedCornerShape(25.dp), spotColor = Color.White.copy(alpha = 0.2f))
                                      .hazeChild(
                                          state = hazeState, 
                                          shape = RoundedCornerShape(25.dp), 
                                          style = HazeStyle(tint = Color.White.copy(alpha = 0.1f), blurRadius = 30.dp, noiseFactor = 0.05f)
                                      )
                              ) {
                                  Row(modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Icon(Icons.Default.Search, contentDescription = "Search", tint = Color.Gray)
                                      Text("Smart Search...", color = Color.Gray, fontSize = 16.sp, modifier = Modifier.weight(1f).padding(start = 12.dp))
                                      Icon(Icons.Default.AccountCircle, contentDescription = "Sync", tint = Color.White.copy(alpha = 0.8f))
                                  }
                              }
                          }

                          // BOTTOM DOCK: 4 ICONS TABS
                          if (activeScreen != "PHOTO") {
                              Box(
                                  modifier = Modifier
                                      .align(Alignment.BottomCenter)
                                      .padding(bottom = 36.dp, start = 30.dp, end = 30.dp)
                                      .fillMaxWidth()
                                      .height(65.dp)
                                      .shadow(elevation = 15.dp, shape = RoundedCornerShape(30.dp), spotColor = Color.White.copy(alpha = 0.5f), ambientColor = Color.White.copy(alpha = 0.5f))
                                      .hazeChild(
                                          state = hazeState, 
                                          shape = RoundedCornerShape(30.dp), 
                                          style = HazeStyle(tint = Color.White.copy(alpha = 0.15f), blurRadius = 40.dp, noiseFactor = 0.05f)
                                      )
                              ) {
                                  Row(modifier = Modifier.fillMaxSize(), horizontalArrangement = Arrangement.SpaceEvenly, verticalAlignment = Alignment.CenterVertically) {
                                      // Photos Tab
                                      IconButton(onClick = { haptic.performHapticFeedback(HapticFeedbackType.LongPress); activeScreen = "GALLERY" }) { 
                                          Icon(Icons.Default.Home, contentDescription = "Photos", tint = if(activeScreen=="GALLERY") Color.White else Color.Gray) 
                                      }
                                      // Explore Tab
                                      IconButton(onClick = { haptic.performHapticFeedback(HapticFeedbackType.LongPress); activeScreen = "EXPLORE" }) { 
                                          Icon(Icons.Default.Search, contentDescription = "Explore", tint = if(activeScreen=="EXPLORE") Color.White else Color.Gray) 
                                      }
                                      // AI Studio Tab
                                      IconButton(onClick = { haptic.performHapticFeedback(HapticFeedbackType.LongPress); activeScreen = "STUDIO" }) { 
                                          Icon(Icons.Default.Edit, contentDescription = "AI Studio", tint = if(activeScreen=="STUDIO") Color.White else Color.Gray) 
                       