                  Spacer(Modifier.height(20.dp))
                  Button(onClick = { }, modifier = Modifier.fillMaxWidth().height(50.dp).padding(horizontal = 16.dp), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF151515), contentColor = Color.White)) { Text("Setup Secure Vault PIN", color = Color.White, fontSize = 16.sp) }
                  Spacer(Modifier.height(20.dp))
                  Card(modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF1a1a1a))) {
