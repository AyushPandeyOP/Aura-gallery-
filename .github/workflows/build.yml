                                  Icon(Icons.Default.Favorite, null, tint = Color(0xFFFFD700), modifier = Modifier.size(20.dp).shadow(4.dp))
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun AlbumCard(album: Album) {
              Card(modifier = Modifier.fillMaxWidth().padding(8.dp).clip(RoundedCornerShape(16.dp)).background(Color(0xFF1a1a1a)), colors = CardDefaults.cardColors(containerColor = Color(0xFF1a1a1a))) {
