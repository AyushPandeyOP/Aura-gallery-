name: Aura Gallery (V40 - The True Flagship) 👑🔥

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android Project from Multi-Files 🪄
        run: |
          mkdir -p app/src/main/java/com/pandeyji/aura/gallery
          mkdir -p app/src/main/res/values

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Aura Gallery"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.3.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.23" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android { namespace = "com.pandeyji.aura.gallery"; compileSdk = 34; defaultConfig { applicationId = "com.pandeyji.aura.gallery"; minSdk = 31; targetSdk = 34; versionCode = 1; versionName = "4.0" }; buildFeatures { compose = true }; composeOptions { kotlinCompilerExtensionVersion = "1.5.11" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }
          dependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.activity:activity-compose:1.8.2"); implementation(platform("androidx.compose:compose-bom:2024.02.00")); implementation("androidx.compose.ui:ui"); implementation("androidx.compose.material3:material3"); implementation("androidx.compose.foundation:foundation"); implementation("dev.chrisbanes.haze:haze:0.6.0"); implementation("io.coil-kt:coil-compose:2.6.0"); implementation("androidx.media3:media3-exoplayer:1.2.1"); implementation("androidx.media3:media3-ui:1.2.1") }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <application android:allowBackup="true" android:label="Aura Gallery" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">Aura Gallery</string></resources>
          EOF

          # 🔥 FILE 1: MEDIA MODEL 🔥
          cat << 'EOF' > app/src/main/java/com/pandeyji/aura/gallery/MediaModel.kt
          package com.pandeyji.aura.gallery
          data class Media(val uri: String, val isVideo: Boolean, val bucketName: String = "Camera", val bucketId: Long = 0L, val isFavorite: Boolean = false, val timestamp: Long = 0L, val displayName: String = "")
          data class Album(val bucketId: Long, val bucketName: String, val thumbnailUri: String, val count: Int, val lastModified: Long)
          enum class ViewMode { ALL_MEDIA, ALBUMS, FAVORITES }
          EOF

          # 🔥 FILE 2: COMPONENTS (SWIPE, KSU BUTTON & ZOOM FIXED) 🔥
          cat << 'EOF' > app/src/main/java/com/pandeyji/aura/gallery/Components.kt
