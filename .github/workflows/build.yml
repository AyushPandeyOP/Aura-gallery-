name: Aura Gallery (God Mode V9 - Real Photos) 💀🔥

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android Project from Scratch 🪄
        run: |
          mkdir -p app/src/main/java/com/aura/gallery
          mkdir -p app/src/main/res/values

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Aura Gallery"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.3.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.23" apply false }
          EOF

          # Added Coil Dependency for Image Loading
          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android { namespace = "com.aura.gallery"; compileSdk = 34; defaultConfig { applicationId = "com.aura.gallery"; minSdk = 31; targetSdk = 34; versionCode = 1; versionName = "1.0" }; buildFeatures { compose = true }; composeOptions { kotlinCompilerExtensionVersion = "1.5.11" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }
          dependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.activity:activity-compose:1.8.2"); implementation(platform("androidx.compose:compose-bom:2024.02.00")); implementation("androidx.compose.ui:ui"); implementation("androidx.compose.material3:material3"); implementation("dev.chrisbanes.haze:haze:0.6.0"); implementation("io.coil-kt:coil-compose:2.6.0") }
          EOF

          # Added Storage Permissions
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <application android:allowBackup="true" android:label="Aura Gallery" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">Aura Gallery</string></resources>
          EOF

          # Real Image Fetching & Coil AsyncImage Engine
          cat << 'EOF' > app/src/main/java/com/aura/gallery/MainActivity.kt
          package com.aura.gallery
          import android.Manifest
          import android.content.ContentUris
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Home
          import androidx.compose.material.icons.filled.Lock
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import coil.compose.AsyncImage
          import dev.chrisbanes.haze.HazeState
          import dev.chrisbanes.haze.haze
          import dev.chrisbanes.haze.hazeChild
          import dev.chrisbanes.haze.HazeStyle
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      val context = LocalContext.current
                      var photos by remember { mutableStateOf<List<String>>(emptyList()) }
                      var hasPermission by remember { mutableStateOf(false) }

                      val permissionLauncher = rememberLauncherForActivityResult(
                          ActivityResultContracts.RequestPermission()
                      ) { isGranted -> hasPermission = isGranted }

                      LaunchedEffect(Unit) {
                          val permission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              Manifest.permission.READ_MEDIA_IMAGES
                          } else {
                              Manifest.permission.READ_EXTERNAL_STORAGE
                          }
                          permissionLauncher.launch(permission)
                      }

                      LaunchedEffect(hasPermission) {
                          if (hasPermission) {
                              withContext(Dispatchers.IO) {
                                  val projection = arrayOf(MediaStore.Images.Media._ID)
                                  val sortOrder = "${MediaStore.Images.Media.DATE_ADDED} DESC"
                                  val query = context.contentResolver.query(
                                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                      projection, null, null, sortOrder
                                  )
                                  val loadedPhotos = mutableListOf<String>()
                                  query?.use { cursor ->
                                      val idColumn = cursor.getColumnIndexOrThrow(MediaStore.Images.Media._ID)
                                      while (cursor.moveToNext()) {
                                          val id = cursor.getLong(idColumn)
                                          val contentUri = ContentUris.withAppendedId(
                                              MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id
                                          ).toString()
                                          loadedPhotos.add(contentUri)
                                      }
                                  }
                                  photos = loadedPhotos
                              }
                          }
                      }

                      val hazeState = remember { HazeState() }
                      Box(modifier = Modifier.fillMaxSize().background(Color.Black)) {
                          if (photos.isEmpty() && hasPermission) {
                              CircularProgressIndicator(modifier = Modifier.align(Alignment.Center), color = Color.White)
                          } else {
                              LazyVerticalGrid(
                                  columns = GridCells.Fixed(4), // 4 columns ki grid
                                  modifier = Modifier.fillMaxSize().haze(state = hazeState), 
                                  contentPadding = PaddingValues(bottom = 90.dp)
                              ) {
                                  items(photos) { uri ->
                                      AsyncImage(
                                          model = uri,
                                          contentDescription = "Photo",
                                          contentScale = ContentScale.Crop,
                                          modifier = Modifier.aspectRatio(1f).padding(1.dp)
                                      )
                                  }
                              }
                          }

                          Box(
                              modifier = Modifier
                                  .align(Alignment.BottomCenter)
                                  .padding(bottom = 24.dp, start = 24.dp, end = 24.dp)
                                  .fillMaxWidth()
                                  .height(70.dp)
                                  .hazeChild(
                                      state = hazeState, 
                                      shape = RoundedCornerShape(35.dp), 
                                      style = HazeStyle(tint = Color.White.copy(alpha = 0.15f), blurRadius = 30.dp, noiseFactor = 0.05f)
                                  )
                          ) {
                              Row(modifier = Modifier.fillMaxSize(), horizontalArrangement = Arrangement.SpaceEvenly, verticalAlignment = Alignment.CenterVertically) {
                                  IconButton(onClick = {}) { Icon(Icons.Default.Home, contentDescription = "Photos", tint = Color.White) }
                                  IconButton(onClick = {}) { Icon(Icons.Default.Lock, contentDescription = "Vault", tint = Color.White) }
                                  IconButton(onClick = {}) { Icon(Icons.Default.Settings, contentDescription = "Settings", tint = Color.White) }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true 

      - name: Compile and Build APK (The Engine)
        run: gradle assembleDebug --no-daemon --refresh-dependencies --stacktrace

      - name: Upload Final APK (Download from here)
        uses: actions/upload-artifact@v4
        with:
          name: AuraGallery-APK
          path: app/build/outputs/apk/debug/app-debug.apk
