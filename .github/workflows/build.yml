name: Aura Gallery (God Mode Builder V5) 💀

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: The Ultimate Dummy Trick (Bypass System Gradle) 🧠
        run: |
          touch settings.gradle
          gradle wrapper --gradle-version 8.4
          rm settings.gradle

      - name: Build Android Project from Scratch 🪄
        run: |
          mkdir -p app/src/main/java/com/aura/gallery

          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; rootProject.name = "Aura Gallery"; include(":app")' > settings.gradle.kts
          
          # Upgraded AGP and Kotlin versions
          echo 'plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }' > build.gradle.kts
          
          # Upgraded Kotlin Compiler Extension
          echo 'plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }; android { namespace = "com.aura.gallery"; compileSdk = 34; defaultConfig { applicationId = "com.aura.gallery"; minSdk = 31; targetSdk = 34; versionCode = 1; versionName = "1.0" }; buildFeatures { compose = true }; composeOptions { kotlinCompilerExtensionVersion = "1.5.9" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }; dependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.activity:activity-compose:1.8.2"); implementation(platform("androidx.compose:compose-bom:2024.02.00")); implementation("androidx.compose.ui:ui"); implementation("androidx.compose.material3:material3"); implementation("dev.chrisbanes.haze:haze:0.6.0") }' > app/build.gradle.kts
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:allowBackup="true" android:label="Aura Gallery" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

          cat << 'EOF' > app/src/main/java/com/aura/gallery/MainActivity.kt
          package com.aura.gallery
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Image
          import androidx.compose.material.icons.filled.Lock
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material3.Icon
          import androidx.compose.material3.IconButton
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.remember
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import dev.chrisbanes.haze.HazeState
          import dev.chrisbanes.haze.haze
          import dev.chrisbanes.haze.hazeChild
          import dev.chrisbanes.haze.HazeStyle

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      val hazeState = remember { HazeState() }
                      Box(modifier = Modifier.fillMaxSize().background(Color.Black)) {
                          LazyVerticalGrid(columns = GridCells.Fixed(3), modifier = Modifier.fillMaxSize().haze(state = hazeState), contentPadding = PaddingValues(bottom = 90.dp)) {
                              items(100) { Box(modifier = Modifier.aspectRatio(1f).padding(1.dp).background(Color.DarkGray)) }
                          }
                          Box(modifier = Modifier.align(Alignment.BottomCenter).padding(bottom = 24.dp, start = 24.dp, end = 24.dp).fillMaxWidth().height(70.dp).hazeChild(state = hazeState, shape = RoundedCornerShape(35.dp), style = HazeStyle(tint = Color.White.copy(alpha = 0.15f), blurRadius = 30.dp, noiseFactor = 0.05f))) {
                              Row(modifier = Modifier.fillMaxSize(), horizontalArrangement = Arrangement.SpaceEvenly, verticalAlignment = Alignment.CenterVertically) {
                                  IconButton(onClick = {}) { Icon(Icons.Default.Image, contentDescription = "Photos", tint = Color.White) }
                                  IconButton(onClick = {}) { Icon(Icons.Default.Lock, contentDescription = "Vault", tint = Color.White) }
                                  IconButton(onClick = {}) { Icon(Icons.Default.Settings, contentDescription = "Settings", tint = Color.White) }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Compile and Build APK (The Engine)
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload Final APK (Download from here)
        uses: actions/upload-artifact@v4
        with:
          name: AuraGallery-APK
          path: app/build/outputs/apk/debug/app-debug.apk
