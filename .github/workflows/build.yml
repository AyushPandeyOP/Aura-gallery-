              Text("Developed By Pandey Ji 👑", color = Color(0xFFFFD700).copy(alpha = alpha), style = TextStyle(shadow = Shadow(Color(0xFFFFD700), blurRadius = 30f * alpha)), fontSize = 18.sp, fontWeight = FontWeight.ExtraBold)
